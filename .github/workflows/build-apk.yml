name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project archive if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/PoolAimAssistant-fixed-project.zip" ]; then
            mkdir -p /tmp/pool-project
            unzip -oq "$GITHUB_WORKSPACE/PoolAimAssistant-fixed-project.zip" -d /tmp/pool-project
            echo "Gradle settings files found:"
            find /tmp/pool-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print
            PROJECT_DIR="$(find /tmp/pool-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          else
            PROJECT_DIR="$GITHUB_WORKSPACE"
          fi
          if [ -z "${PROJECT_DIR:-}" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::Could not locate the Gradle project."
            find /tmp/pool-project -maxdepth 5 -type f 2>/dev/null | head -150 || true
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Selected project directory: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradlew' -o -name 'AndroidManifest.xml' \) -print

      - name: Fix foreground service API compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          project = Path(os.environ["PROJECT_DIR"])
          source = project / "app/src/main/java/com/poolaim/assistant/service/OverlayAimService.kt"
          text = source.read_text()
          old = """        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(
                          NOTIFICATION_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      )
                  } else {
                      startForeground(NOTIFICATION_ID, notification)
                  }"""
          new = """        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      startForeground(
                          NOTIFICATION_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      )
                  } else {
                      startForeground(NOTIFICATION_ID, notification)
                  }"""
          if old not in text:
              raise SystemExit("Could not find foreground-service compatibility block; refusing to build an unpatched APK.")
          text = text.replace(old, new, 1)

          old_start = """            ACTION_START, null -> {
                          startForegroundWithNotification()
                          initOverlays()
                      }"""
          new_start = """            ACTION_START, null -> {
                          try {
                              startForegroundWithNotification()
                              initOverlays()
                          } catch (e: Exception) {
                              android.util.Log.e("PoolAimAssistant", "Failed to start overlay service", e)
                              android.widget.Toast.makeText(
                                  this,
                                  "Assistant error: ${e.javaClass.simpleName}: ${e.message}",
                                  android.widget.Toast.LENGTH_LONG
                              ).show()
                              stopForeground(STOP_FOREGROUND_REMOVE)
                              stopSelf()
                              return START_NOT_STICKY
                          }
                      }"""
          if old_start not in text:
              raise SystemExit("Could not find service-start block; refusing to build without crash diagnostics.")
          text = text.replace(old_start, new_start, 1)
          source.write_text(text)
          print("Patched Android foreground-service compatibility and added visible service-start error reporting.")
          PY

      - name: Fix overlay layout theme attribute crash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          layout = Path(os.environ["PROJECT_DIR"]) / "app/src/main/res/layout/view_overlay_controls.xml"
          if not layout.exists():
              raise SystemExit(f"Required overlay layout not found: {layout}")
          source = layout.read_text()
          old = "?selectableItemBackgroundBorderless"
          new = "?android:attr/selectableItemBackgroundBorderless"
          count = source.count(old)
          if count != 4:
              raise SystemExit(f"Expected 4 overlay button background attributes, found {count}; refusing an uncertain patch.")
          layout.write_text(source.replace(old, new))
          print(f"Updated {count} overlay buttons to use the explicit Android framework ripple attribute.")
          PY

      - name: Add persistent shot-learning feedback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          project = Path(os.environ["PROJECT_DIR"])
          base = project / "app/src/main/java/com/poolaim/assistant"
          aim = base / "overlay/AimOverlayView.kt"
          controls = base / "overlay/OverlayControlsView.kt"
          service = base / "service/OverlayAimService.kt"
          layout = project / "app/src/main/res/layout/view_overlay_controls.xml"
          a = aim.read_text()
          c = controls.read_text()
          s = service.read_text()
          x = layout.read_text()
          if "fun recordShot(success: Boolean)" not in a:
              a = a.replace(
                  "    fun setTouchLocked(locked: Boolean) {",
                  '''    // User-reported outcomes provide lightweight on-device adaptive calibration.
              private val learningPrefs by lazy { context.getSharedPreferences("aim_learning", Context.MODE_PRIVATE) }
              private var learnedOffsetRad: Double = 0.0
              private var successfulSamples: Int = 0
              private var missedSamples: Int = 0

              private fun directAngle(): Double = atan2((targetY - cueY).toDouble(), (targetX - cueX).toDouble())
              private fun normalizeAngle(angle: Double): Double {
                  var value = angle
                  while (value > Math.PI) value -= 2.0 * Math.PI
                  while (value < -Math.PI) value += 2.0 * Math.PI
                  return value
              }

              init {
                  learnedOffsetRad = learningPrefs.getFloat("learned_offset", 0f).toDouble()
                  successfulSamples = learningPrefs.getInt("success_count", 0)
                  missedSamples = learningPrefs.getInt("miss_count", 0)
              }

              fun recordShot(success: Boolean) {
                  val offset = normalizeAngle(aimAngleRad - directAngle())
                  if (success) {
                      // Slowly average successful offsets so one report cannot dominate.
                      val rate = if (successfulSamples == 0) 1.0 else 1.0 / min(12, successfulSamples + 1)
                      learnedOffsetRad = normalizeAngle(learnedOffsetRad + normalizeAngle(offset - learnedOffsetRad) * rate)
                      successfulSamples++
                      learningPrefs.edit().putFloat("learned_offset", learnedOffsetRad.toFloat())
                          .putInt("success_count", successfulSamples).apply()
                      aimAngleRad = normalizeAngle(directAngle() + learnedOffsetRad)
                      android.widget.Toast.makeText(context, "Learning saved: $successfulSamples successful shots", android.widget.Toast.LENGTH_SHORT).show()
                  } else {
                      missedSamples++
                      // If a miss repeats near the current angle, make a small conservative correction.
                      val correction = Math.toRadians(0.5)
                      val direction = if (normalizeAngle(offset - learnedOffsetRad) >= 0.0) -1.0 else 1.0
                      learnedOffsetRad = normalizeAngle(learnedOffsetRad + direction * correction)
                      learningPrefs.edit().putFloat("learned_offset", learnedOffsetRad.toFloat())
                          .putInt("miss_count", missedSamples).apply()
                      aimAngleRad = normalizeAngle(directAngle() + learnedOffsetRad)
                      android.widget.Toast.makeText(context, "Adjustment saved: $missedSamples missed shots", android.widget.Toast.LENGTH_SHORT).show()
                  }
                  invalidate()
              }

              fun learningSummary(): String = "Learned offset %.2f° · %d hit / %d miss".format(
                  Math.toDegrees(learnedOffsetRad), successfulSamples, missedSamples
              )

              fun setTouchLocked(locked: Boolean) {''', 1)
              a = a.replace(
                  "                        aimAngleRad = atan2((targetY - cueY).toDouble(), (targetX - cueX).toDouble())",
                  "                        aimAngleRad = normalizeAngle(atan2((targetY - cueY).toDouble(), (targetX - cueX).toDouble()) + learnedOffsetRad)", 1
              )
              a = a.replace(
                  "                        targetY = y\n                    }",
                  "                        targetY = y\n                        aimAngleRad = normalizeAngle(directAngle() + learnedOffsetRad)\n                    }", 1
              )
              aim.write_text(a)
          if "onShotFeedback" not in c:
              c = c.replace(
                  "    private val onCloseRequested: () -> Unit\n",
                  "    private val onCloseRequested: () -> Unit,\n    private val onShotFeedback: (Boolean) -> Unit\n", 1
              )
              c = c.replace(
                  "        closeBtn = findViewById(R.id.btnCloseOverlay)\n",
                  "        closeBtn = findViewById(R.id.btnCloseOverlay)\n        findViewById<android.widget.Button>(R.id.btnShotHit).setOnClickListener { onShotFeedback(true) }\n        findViewById<android.widget.Button>(R.id.btnShotMiss).setOnClickListener { onShotFeedback(false) }\n", 1
              )
              controls.write_text(c)
          if "onShotFeedback = { success" not in s:
              s = s.replace(
                  "            onCloseRequested = {\n                stopSelf()\n            }\n",
                  "            onCloseRequested = {\n                stopSelf()\n            },\n            onShotFeedback = { success -> aimOverlayView?.recordShot(success) }\n", 1
              )
              service.write_text(s)
          if "btnShotHit" not in x:
              insertion = '''
                  <Button
                      android:id="@+id/btnShotHit"
                      android:layout_width="wrap_content"
                      android:layout_height="40dp"
                      android:minWidth="0dp"
                      android:paddingStart="8dp"
                      android:paddingEnd="8dp"
                      android:text="HIT"
                      android:textSize="11sp"
                      android:contentDescription="Record successful shot" />

                  <Button
                      android:id="@+id/btnShotMiss"
                      android:layout_width="wrap_content"
                      android:layout_height="40dp"
                      android:minWidth="0dp"
                      android:paddingStart="8dp"
                      android:paddingEnd="8dp"
                      android:text="MISS"
                      android:textSize="11sp"
                      android:contentDescription="Record missed shot" />
          '''
              x = x.replace('''        <ImageButton
            android:id="@+id/btnCloseOverlay"''', insertion + '''
        <ImageButton
            android:id="@+id/btnCloseOverlay"''', 1)
              layout.write_text(x)
          print("Added HIT/MISS feedback, persistent adaptive aim-offset learning, and automatic reuse of learned calibration.")
          PY

      - name: Diagnose overlay layout inflation failure
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Overlay-related XML resources ==="
          find "$PROJECT_DIR/app/src/main/res" -type f -name '*.xml' -print | sort
          echo "=== Overlay controls layout with line numbers ==="
          for f in "$PROJECT_DIR/app/src/main/res/layout/view_overlay_controls.xml" "$PROJECT_DIR/app/src/main/res/layout/view_overlay.xml"; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              nl -ba "$f" | sed -n '1,100p'
            fi
          done
          echo "=== Overlay controls Kotlin inflation calls ==="
          grep -RInE 'inflate\(|view_overlay|OverlayControlsView|LayoutInflater' "$PROJECT_DIR/app/src/main/java" || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect Gradle modules
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon projects
          else
            gradle --no-daemon projects
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi
          echo "APK files found after build:"
          find "$PROJECT_DIR" -type f -name '*.apk' -print

      - name: Collect APK for upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -print -exec cp -v {} "$GITHUB_WORKSPACE/apk-output/" \;
          if ! find "$GITHUB_WORKSPACE/apk-output" -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "::error::Gradle did not produce an APK under build/outputs/apk."
            find "$PROJECT_DIR" -path '*/build/outputs/*' -type f -print | head -200
            exit 1
          fi
          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Package overlay source diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/overlay-diagnostics"
          find "$PROJECT_DIR/app/src/main" -type f \( -name '*.xml' -o -name '*.kt' \) -print0 | while IFS= read -r -d '' f; do
            case "$f" in
              */res/layout/*|*/res/values/*|*/java/*Overlay*|*/java/*overlay*|*/java/*Service*)
                dest="$GITHUB_WORKSPACE/overlay-diagnostics/${f#"$PROJECT_DIR/app/src/main/"}"
                mkdir -p "$(dirname "$dest")"
                cp "$f" "$dest"
                ;;
            esac
          done
          find "$GITHUB_WORKSPACE/overlay-diagnostics" -type f -print

      - name: Upload overlay source diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: overlay-source-diagnostics
          path: overlay-diagnostics/
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pool-aim-assistant-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
