name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and locate Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/PoolAimAssistant-fixed-project.zip" ]; then
            mkdir -p /tmp/pool-project
            unzip -oq "$GITHUB_WORKSPACE/PoolAimAssistant-fixed-project.zip" -d /tmp/pool-project
            echo "Gradle settings files found:"
            find /tmp/pool-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print
            PROJECT_DIR="$(find /tmp/pool-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          else
            PROJECT_DIR="$GITHUB_WORKSPACE"
          fi
          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Could not locate the Gradle project."
            find /tmp/pool-project -maxdepth 5 -type f 2>/dev/null | head -150 || true
            exit 1
          fi
          echo "Selected project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradlew' -o -name 'AndroidManifest.xml' \) -print

      - name: Fix foreground service API compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          project = Path(os.environ["PROJECT_DIR"])
          source = project / "app/src/main/java/com/poolaim/assistant/service/OverlayAimService.kt"
          text = source.read_text()
          old = """        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
            startForeground(
                NOTIFICATION_ID,
                notification,
                ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
            )
        } else {
            startForeground(NOTIFICATION_ID, notification)
        }"""
          new = """        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
            startForeground(
                NOTIFICATION_ID,
                notification,
                ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
            )
        } else {
            startForeground(NOTIFICATION_ID, notification)
        }"""
          if old not in text:
              raise SystemExit("Could not find foreground-service compatibility block; refusing to build an unpatched APK.")
          if old not in text:
              raise SystemExit("Could not find foreground-service compatibility block; refusing to build an unpatched APK.")
          text = text.replace(old, new, 1)

          old_start = """            ACTION_START, null -> {
                startForegroundWithNotification()
                initOverlays()
            }"""
          new_start = """            ACTION_START, null -> {
                try {
                    startForegroundWithNotification()
                    initOverlays()
                } catch (e: Exception) {
                    android.util.Log.e("PoolAimAssistant", "Failed to start overlay service", e)
                    android.widget.Toast.makeText(
                        this,
                        "Assistant error: ${e.javaClass.simpleName}: ${e.message}",
                        android.widget.Toast.LENGTH_LONG
                    ).show()
                    stopForeground(STOP_FOREGROUND_REMOVE)
                    stopSelf()
                    return START_NOT_STICKY
                }
            }"""
          if old_start not in text:
              raise SystemExit("Could not find service-start block; refusing to build without crash diagnostics.")
          text = text.replace(old_start, new_start, 1)
          source.write_text(text)
          print("Patched Android foreground-service compatibility and added visible service-start error reporting.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect Gradle modules
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon projects
          else
            gradle --no-daemon projects
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi
          echo "APK files found after build:"
          find "$PROJECT_DIR" -type f -name '*.apk' -print
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -exec cp -v {} "$GITHUB_WORKSPACE/apk-output/" \;
          if ! find "$GITHUB_WORKSPACE/apk-output" -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "ERROR: Gradle completed but produced no APK under build/outputs/apk."
            echo "Available build output files:"
            find "$PROJECT_DIR" -path '*/build/outputs/*' -type f -print | head -200
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pool-aim-assistant-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
