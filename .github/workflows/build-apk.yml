name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project archive if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/PoolAimAssistant-fixed-project.zip" ]; then
            mkdir -p /tmp/pool-project
            unzip -oq "$GITHUB_WORKSPACE/PoolAimAssistant-fixed-project.zip" -d /tmp/pool-project
            echo "Gradle settings files found:"
            find /tmp/pool-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print
            PROJECT_DIR="$(find /tmp/pool-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          else
            PROJECT_DIR="$GITHUB_WORKSPACE"
          fi
          if [ -z "${PROJECT_DIR:-}" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::Could not locate the Gradle project."
            find /tmp/pool-project -maxdepth 5 -type f 2>/dev/null | head -150 || true
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Selected project directory: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradlew' -o -name 'AndroidManifest.xml' \) -print

      - name: Fix foreground service API compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          project = Path(os.environ["PROJECT_DIR"])
          source = project / "app/src/main/java/com/poolaim/assistant/service/OverlayAimService.kt"
          text = source.read_text()
          old = """        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(
                          NOTIFICATION_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      )
                  } else {
                      startForeground(NOTIFICATION_ID, notification)
                  }"""
          new = """        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      startForeground(
                          NOTIFICATION_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      )
                  } else {
                      startForeground(NOTIFICATION_ID, notification)
                  }"""
          if old not in text:
              raise SystemExit("Could not find foreground-service compatibility block; refusing to build an unpatched APK.")
          text = text.replace(old, new, 1)

          old_start = """            ACTION_START, null -> {
                          startForegroundWithNotification()
                          initOverlays()
                      }"""
          new_start = """            ACTION_START, null -> {
                          try {
                              startForegroundWithNotification()
                              initOverlays()
                          } catch (e: Exception) {
                              android.util.Log.e("PoolAimAssistant", "Failed to start overlay service", e)
                              android.widget.Toast.makeText(
                                  this,
                                  "Assistant error: ${e.javaClass.simpleName}: ${e.message}",
                                  android.widget.Toast.LENGTH_LONG
                              ).show()
                              stopForeground(STOP_FOREGROUND_REMOVE)
                              stopSelf()
                              return START_NOT_STICKY
                          }
                      }"""
          if old_start not in text:
              raise SystemExit("Could not find service-start block; refusing to build without crash diagnostics.")
          text = text.replace(old_start, new_start, 1)
          source.write_text(text)
          print("Patched Android foreground-service compatibility and added visible service-start error reporting.")
          PY

      - name: Fix overlay layout theme attribute crash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          layout = Path(os.environ["PROJECT_DIR"]) / "app/src/main/res/layout/view_overlay_controls.xml"
          if not layout.exists():
              raise SystemExit(f"Required overlay layout not found: {layout}")
          source = layout.read_text()
          old = "?selectableItemBackgroundBorderless"
          new = "?android:attr/selectableItemBackgroundBorderless"
          count = source.count(old)
          if count != 4:
              raise SystemExit(f"Expected 4 overlay button background attributes, found {count}; refusing an uncertain patch.")
          layout.write_text(source.replace(old, new))
          print(f"Updated {count} overlay buttons to use the explicit Android framework ripple attribute.")
          PY

      - name: Add persistent shot feedback and calibration learning
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"])
          root = p / "app/src/main"
          aim = root / "java/com/poolaim/assistant/overlay/AimOverlayView.kt"
          controls = root / "java/com/poolaim/assistant/overlay/OverlayControlsView.kt"
          service = root / "java/com/poolaim/assistant/service/OverlayAimService.kt"
          layout = root / "res/layout/view_overlay_controls.xml"
          a, c, s, x = aim.read_text(), controls.read_text(), service.read_text(), layout.read_text()
          required = ["private var aimAngleRad = 0.0", "fun setTouchLocked(locked: Boolean)"]
          if not all(v in a for v in required):
              raise SystemExit("AimOverlayView structure differs; learning patch stopped safely.")
          if "fun recordShotOutcome(success: Boolean)" not in a:
              a = a.replace("    private var aimAngleRad = 0.0 // Radians", """    private var aimAngleRad = 0.0 // Radians

              // User-confirmed outcomes are stored locally; no screenshots or gameplay data leave the device.
              private val learningPrefs = context.getSharedPreferences("aim_learning", Context.MODE_PRIVATE)
              private var learnedOffsetRad = learningPrefs.getFloat("learned_offset_rad", 0f).toDouble()
              private var successfulShots = learningPrefs.getInt("successful_shots", 0)
              private var missedShots = learningPrefs.getInt("missed_shots", 0)

              private fun directAngle(): Double = atan2((targetY - cueY).toDouble(), (targetX - cueX).toDouble())
              private fun wrapAngle(value: Double): Double {
                  var angle = value
                  while (angle > Math.PI) angle -= 2.0 * Math.PI
                  while (angle < -Math.PI) angle += 2.0 * Math.PI
                  return angle
              }

              fun recordShotOutcome(success: Boolean) {
                  if (success) {
                      val observed = wrapAngle(aimAngleRad - directAngle())
                      val rate = 1.0 / min(10, successfulShots + 1)
                      learnedOffsetRad = if (successfulShots == 0) observed else
                          wrapAngle(learnedOffsetRad + wrapAngle(observed - learnedOffsetRad) * rate)
                      successfulShots++
                  } else {
                      missedShots++
                  }
                  learningPrefs.edit()
                      .putFloat("learned_offset_rad", learnedOffsetRad.toFloat())
                      .putInt("successful_shots", successfulShots)
                      .putInt("missed_shots", missedShots)
                      .apply()
                  val message = if (success) "Saved calibration · $successfulShots successful" else "Miss recorded · $missedShots missed"
                  android.widget.Toast.makeText(context, message, android.widget.Toast.LENGTH_SHORT).show()
                  invalidate()
              }

              fun learningSummary(): String = "Calibration %.2f° · %d successful / %d missed".format(
                  Math.toDegrees(learnedOffsetRad), successfulShots, missedShots
              )""", 1)
              a = a.replace("aimAngleRad = atan2((targetY - cueY).toDouble(), (targetX - cueX).toDouble())", "aimAngleRad = wrapAngle(directAngle() + learnedOffsetRad)", 1)
              a = a.replace("                        targetY = y\n                    }", "                        targetY = y\n                        aimAngleRad = wrapAngle(directAngle() + learnedOffsetRad)\n                    }", 1)
              aim.write_text(a)
          if "onShotOutcome" not in c:
              c = c.replace("    private val onCloseRequested: () -> Unit\n", "    private val onCloseRequested: () -> Unit,\n    private val onShotOutcome: (Boolean) -> Unit\n", 1)
              c = c.replace("        closeBtn = findViewById(R.id.btnCloseOverlay)\n", "        closeBtn = findViewById(R.id.btnCloseOverlay)\n        findViewById<android.widget.Button>(R.id.btnShotSuccess).setOnClickListener { onShotOutcome(true) }\n        findViewById<android.widget.Button>(R.id.btnShotMiss).setOnClickListener { onShotOutcome(false) }\n", 1)
              controls.write_text(c)
          if "onShotOutcome = { success" not in s:
              import re
              pattern = r"onCloseRequested\s*=\s*\{\s*stopSelf\(\)\s*\}\s*\)"
              new_service = "onCloseRequested = {\n                stopSelf()\n            },\n            onShotOutcome = { success -> aimOverlayView?.recordShotOutcome(success) }\n        )"
              s, count = re.subn(pattern, lambda _: new_service, s, count=1)
              if count != 1:
                  raise SystemExit("Overlay service close callback not found; learning patch stopped safely.")
              service.write_text(s)
          if "btnShotSuccess" not in x:
              old = '        <ImageButton\n            android:id="@+id/btnCloseOverlay"'
              new = '        <Button android:id="@+id/btnShotSuccess" android:layout_width="wrap_content" android:layout_height="40dp" android:minWidth="0dp" android:text="HIT" android:textSize="11sp" android:contentDescription="Record successful shot" />\n        <Button android:id="@+id/btnShotMiss" android:layout_width="wrap_content" android:layout_height="40dp" android:minWidth="0dp" android:text="MISS" android:textSize="11sp" android:contentDescription="Record missed shot" />\n        <ImageButton android:id="@+id/btnCloseOverlay"'
              if old not in x:
                  raise SystemExit("Overlay close button XML anchor not found; learning patch stopped safely.")
              layout.write_text(x.replace(old, new, 1))
          # Make the overlay pass touches through to the pool game by default.
          # Users can explicitly unlock it from the floating bubble when repositioning is needed.
          if "DEFAULT_TOUCH_PASSTHROUGH" not in s:
              marker = "        windowManager.addView(aimOverlayView, aimParams)"
              replacement = """        windowManager.addView(aimOverlayView, aimParams)
        
                // DEFAULT_TOUCH_PASSTHROUGH: the aiming layer must not swallow normal game taps.
                aimParams.flags = aimParams.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                windowManager.updateViewLayout(aimOverlayView, aimParams)"""
              if marker not in s:
                  raise SystemExit("Overlay insertion point not found; refusing touch-pass-through patch.")
              s = s.replace(marker, replacement, 1)
              service.write_text(s)
          if "DEFAULT_TOUCH_PASSTHROUGH" not in c:
              marker = "        setupInteractions()"
              replacement = """        setupInteractions()
        
                // Start locked so taps reach the game; unlock only for manual marker adjustment.
                isLocked = true
                lockBtn.setImageResource(R.drawable.ic_lock_closed)
                onLockToggled(true)"""
              if marker not in c:
                  raise SystemExit("Controls initialization point not found; refusing touch-pass-through patch.")
              c = c.replace(marker, replacement, 1)
              controls.write_text(c)
          print("Shot feedback and locally persisted calibration are installed; overlay touch-through is enabled by default.")
          PY

      - name: Add shot difficulty guidance to the overlay HUD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/com/poolaim/assistant/overlay/AimOverlayView.kt"
          text = source.read_text()
          old = '            val cutAngleText = String.format("Cut: %.1f°", result.cutAngleDeg)\n            canvas.drawText(cutAngleText, targetX - 50f, targetY - ballRadius - 15f, textPaint)'
          new = '''            val cutAngle = abs(result.cutAngleDeg)
                      .coerceIn(0.0, 180.0)
                  val difficulty = when {
                      cutAngle < 12.0 -> "STRAIGHT"
                      cutAngle < 30.0 -> "EASY"
                      cutAngle < 55.0 -> "MEDIUM"
                      else -> "HARD"
                  }
                  val shotDistance = hypot(
                      (targetX - cueX).toDouble(),
                      (targetY - cueY).toDouble()
                  )
                  val cutAngleText = String.format(
                      "Cut %.1f° · %s · Dist %.0fpx",
                      result.cutAngleDeg, difficulty, shotDistance
                  )
                  canvas.drawText(cutAngleText, targetX - 50f, targetY - ballRadius - 15f, textPaint)'''
          if old in text:
              source.write_text(text.replace(old, new, 1))
              print("Added a transparent geometry-based difficulty hint to the HUD.")
          elif 'Dist %.0fpx' in text:
              print("Shot difficulty HUD already exists; no change needed.")
          else:
              raise SystemExit("Expected cut-angle HUD anchor not found; refusing an uncertain patch.")
          PY

      - name: Add built-in billiards practice guide to app UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          project = Path(os.environ["PROJECT_DIR"])
          main = project / "app/src/main/res/layout/activity_main.xml"
          source = main.read_text()
          if "btnPracticeGuide" not in source:
              button = '''
              <Button
                  android:id="@+id/btnPracticeGuide"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  android:text="Billiards Rules &amp; Practice Guide"
                  android:backgroundTint="#0D9488" />
          '''
              if "</LinearLayout>" not in source:
                  raise SystemExit("Main layout root changed; cannot safely add practice guide button.")
              source = source.replace("</LinearLayout>", button + "\n</LinearLayout>", 1)
              main.write_text(source)
          candidates = list((project / "app/src/main/java").rglob("MainActivity.kt"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one MainActivity.kt, found {len(candidates)}")
          activity = candidates[0]
          kotlin = activity.read_text()
          if "btnPracticeGuide" not in kotlin:
              anchor = "setContentView(R.layout.activity_main)"
              if anchor not in kotlin:
                  raise SystemExit("MainActivity setContentView anchor not found; refusing uncertain UI patch.")
              injected = '''
                  findViewById<android.widget.Button>(R.id.btnPracticeGuide).setOnClickListener {
                      val guide = """
          EIGHT-BALL BASICS
          • Solids: balls 1–7. Stripes: balls 9–15. The 8-ball is black.
          • After groups are assigned, contact your group first on a legal shot, following the game's break/open-table rules.
          • A legal shot commonly requires a ball to be pocketed or a ball to contact a cushion after contact.
          • Pocketing the 8-ball before clearing your group, or while fouling, commonly loses the rack. Rules vary by game and venue.
          • A scratch (cue ball pocketed) is commonly a foul.

          AIMING & GEOMETRY
          • Aim line: direction from cue-ball center to the intended contact point.
          • Ghost ball: imagine the cue-ball center at the contact location that sends the object ball toward the pocket.
          • Smaller cut angles are generally easier, all else being equal.
          • A simple bank-shot model reflects the angle at the cushion; speed, spin and cushion condition change real results.
          • Longer paths are more sensitive to alignment and speed errors.

          PRACTICE CHECKLIST
          1. Mark the cue ball, target ball, intended pocket and cushion boundaries.
          2. Practice straight shots, thin cuts and one-cushion banks separately.
          3. Compare estimated routes with what happens, then recalibrate manually.
          4. Treat the difficulty label as a geometry estimate, not a success probability.

          LIMITATIONS
          This overlay currently uses manually positioned markers. This guide does not mean automatic ball detection or screen capture is implemented. Screen capture must be started with Android's explicit permission, and detection must be validated against real screenshots.
                      """.trimIndent()
                      android.app.AlertDialog.Builder(this)
                          .setTitle("Billiards Practice Guide")
                          .setMessage(guide)
                          .setPositiveButton("Close", null)
                          .show()
                  }
          '''
              kotlin = kotlin.replace(anchor, anchor + "\n" + injected, 1)
              activity.write_text(kotlin)
          print("Added an in-app rules and practice guide with an explicit limitations note.")
          PY

      - name: Add original billiards table illustration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          project = Path(os.environ["PROJECT_DIR"])
          drawable = project / "app/src/main/res/drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          asset = drawable / "ic_billiards_practice.xml"
          asset.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp" android:height="112dp"
              android:viewportWidth="320" android:viewportHeight="112">
              <path android:fillColor="#052E2B" android:pathData="M8,8 L312,8 L312,104 L8,104 Z"/>
              <path android:fillColor="#0F766E" android:pathData="M20,18 L300,18 L300,94 L20,94 Z"/>
              <path android:fillColor="#064E3B" android:pathData="M24,22 L296,22 L296,90 L24,90 Z"/>
              <path android:fillColor="#020617" android:pathData="M13,13 m-5,0 a5,5 0,1 0,10 0 a5,5 0,1 0,-10 0 M160,13 m-5,0 a5,5 0,1 0,10 0 a5,5 0,1 0,-10 0 M307,13 m-5,0 a5,5 0,1 0,10 0 a5,5 0,1 0,-10 0 M13,99 m-5,0 a5,5 0,1 0,10 0 a5,5 0,1 0,-10 0 M160,99 m-5,0 a5,5 0,1 0,10 0 a5,5 0,1 0,-10 0 M307,99 m-5,0 a5,5 0,1 0,10 0 a5,5 0,1 0,-10 0"/>
              <path android:fillColor="#F8FAFC" android:pathData="M67,56 m-9,0 a9,9 0,1 0,18 0 a9,9 0,1 0,-18 0"/>
              <path android:fillColor="#F8FAFC" android:pathData="M67,56 m-3,-3 a3,3 0,1 0,6 0 a3,3 0,1 0,-6 0"/>
              <path android:fillColor="#DC2626" android:pathData="M133,56 m-9,0 a9,9 0,1 0,18 0 a9,9 0,1 0,-18 0"/>
              <path android:fillColor="#F8FAFC" android:pathData="M133,56 m-4,-4 a4,4 0,1 0,8 0 a4,4 0,1 0,-8 0"/>
              <path android:fillColor="#FBBF24" android:pathData="M183,42 m-8,0 a8,8 0,1 0,16 0 a8,8 0,1 0,-16 0"/>
              <path android:fillColor="#F8FAFC" android:pathData="M183,42 m-3,-3 a3,3 0,1 0,6 0 a3,3 0,1 0,-6 0"/>
              <path android:fillColor="#2563EB" android:pathData="M220,66 m-9,0 a9,9 0,1 0,18 0 a9,9 0,1 0,-18 0"/>
              <path android:fillColor="#F8FAFC" android:pathData="M220,66 m-4,-4 a4,4 0,1 0,8 0 a4,4 0,1 0,-8 0"/>
              <path android:strokeColor="#F8FAFC" android:strokeWidth="1.5" android:strokeLineCap="round" android:pathData="M76,56 L122,56"/>
              <path android:strokeColor="#F8FAFC" android:strokeWidth="1.5" android:pathData="M115,51 L122,56 L115,61"/>
          </vector>
          """)
          layout = project / "app/src/main/res/layout/activity_main.xml"
          xml = layout.read_text()
          if "ivBilliardsPractice" not in xml:
              anchor = '    <Button\n        android:id="@+id/btnPracticeGuide"'
              image = '''    <ImageView
                  android:id="@+id/ivBilliardsPractice"
                  android:layout_width="match_parent"
                  android:layout_height="112dp"
                  android:layout_marginTop="14dp"
                  android:contentDescription="Illustration of billiards balls and a suggested path"
                  android:scaleType="fitCenter"
                  android:src="@drawable/ic_billiards_practice" />

          '''
              if anchor not in xml:
                  raise SystemExit("Practice-guide button anchor missing; refusing to insert illustration.")
              layout.write_text(xml.replace(anchor, image + anchor, 1))
          print("Added an original vector table illustration and connected it to the main screen.")
          PY

      - name: Diagnose overlay layout inflation failure
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Overlay-related XML resources ==="
          find "$PROJECT_DIR/app/src/main/res" -type f -name '*.xml' -print | sort
          echo "=== Overlay controls layout with line numbers ==="
          for f in "$PROJECT_DIR/app/src/main/res/layout/view_overlay_controls.xml" "$PROJECT_DIR/app/src/main/res/layout/view_overlay.xml"; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              nl -ba "$f" | sed -n '1,100p'
            fi
          done
          echo "=== Overlay controls Kotlin inflation calls ==="
          grep -RInE 'inflate\(|view_overlay|OverlayControlsView|LayoutInflater' "$PROJECT_DIR/app/src/main/java" || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect Gradle modules
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon projects
          else
            gradle --no-daemon projects
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi
          echo "APK files found after build:"
          find "$PROJECT_DIR" -type f -name '*.apk' -print

      - name: Collect APK for upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -print -exec cp -v {} "$GITHUB_WORKSPACE/apk-output/" \;
          if ! find "$GITHUB_WORKSPACE/apk-output" -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "::error::Gradle did not produce an APK under build/outputs/apk."
            find "$PROJECT_DIR" -path '*/build/outputs/*' -type f -print | head -200
            exit 1
          fi
          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Package overlay source diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/overlay-diagnostics"
          find "$PROJECT_DIR/app/src/main" -type f \( -name '*.xml' -o -name '*.kt' \) -print0 | while IFS= read -r -d '' f; do
            case "$f" in
              */res/layout/*|*/res/values/*|*/java/*Overlay*|*/java/*overlay*|*/java/*Service*)
                dest="$GITHUB_WORKSPACE/overlay-diagnostics/${f#"$PROJECT_DIR/app/src/main/"}"
                mkdir -p "$(dirname "$dest")"
                cp "$f" "$dest"
                ;;
            esac
          done
          find "$GITHUB_WORKSPACE/overlay-diagnostics" -type f -print

      - name: Upload overlay source diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: overlay-source-diagnostics
          path: overlay-diagnostics/
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pool-aim-assistant-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
